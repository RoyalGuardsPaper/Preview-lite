[package]
name = "preview-lite"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A lightweight, offline-first PDF and image viewer for Linux"

[dependencies]
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
gio = "0.20"
glib = "0.20"
gdk-pixbuf = "0.20"
poppler = "0.6"
